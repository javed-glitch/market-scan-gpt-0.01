name: Intraday Scan (4H, UK hours) -> Telegram

on:
  workflow_dispatch:
  schedule:
    # UK time currently = UTC. Runs at 08:00, 12:00, 16:00, 20:00 (Mon–Fri)
    - cron: "0 8,12,16,20 * * 1-5"

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout intraday branch
        uses: actions/checkout@v4
        with:
          ref: intraday

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intraday
        env:
          SYMBOLS: NVDA,AMAT,PLTR,TSLA,QQQ,CMG
          ETF_SYMBOLS: QQQ
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTION_CONFIDENCE_MIN: "70"
        run: |
          python intraday.py

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: intraday-scan-logs
          path: logs/
