name: Market Cycle Dashboard -> Telegram
on:
  workflow_dispatch:
  schedule:
    # Once daily only (2026-08-10 — reduced from 3x to cut Telegram noise).
    # Moved earlier 2026-09-24: GitHub Actions' `schedule` trigger was
    # queuing this repo's runs 2.5-4h behind nominal cron time (measured
    # across 8-40 real runs — see chat), landing Telegram output ~9-10pm
    # UK time regardless of the 18:12 nominal slot. Nominal time moved to
    # 11:30 UTC aiming for an actual landing nearer market open (~14:42
    # UTC, still +12min after intraday.yml's own 14:30 open-slot to avoid
    # the Twelve Data rate-limit collision both workflows share via
    # TWELVEDATA_API_KEY) -- but the delay did NOT behave as a fixed
    # offset: earlier-nominal slots were delayed MORE (14:30 slot ~4.2h
    # vs 20:45 slot ~2.4h), suggesting this account's scheduled-workflow
    # queue doesn't drain until ~17:30 UTC regardless of nominal time, and
    # jobs fire roughly in nominal order from there. That means this
    # earlier slot could land ahead of intraday.yml's own open-slot run
    # instead of safely after its mid-slot run as before -- unverified,
    # treat as a live experiment. Re-check actual run times (`gh run list
    # --workflow=cycle.yml`) after a week; adjust or revert if it collides
    # or doesn't actually land earlier.
    - cron: "30 11 * * 1-5"
jobs:
  cycle_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MPLBACKEND: Agg
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy matplotlib yfinance
      - name: Run cycle dashboard
        env:
          # Symbols and per-symbol facts (yahoo code, currency, pence, etf) come from the
          # shared hco-symbols registry (feed "cycle"). Setting SYMBOLS here would override the
          # list only. If the registry is down the bot uses symbols_last_good.json, which each
          # successful run refreshes and this workflow commits. Tags: pre-registry-20261031,
          # pre-registry-meta-20261031.
          SYMBOLS_FEED: cycle
          CAPITAL_PER_TICKER: "3000"
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.CYCLE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CYCLE_TELEGRAM_CHAT_ID }}
          TD_MIN_SECONDS_BETWEEN_CALLS: "11"
        run: |
          python cycle_bot.py
      - name: Commit cycle_data.json and symbols_last_good.json
        run: |
          if [ -n "$(git status --porcelain -- cycle_data.json symbols_last_good.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add cycle_data.json symbols_last_good.json 2>/dev/null || true
            git commit -m "Update cycle_data.json / symbols_last_good.json [skip ci]"
            git push
          else
            echo "cycle_data.json and symbols_last_good.json unchanged — nothing to commit."
          fi
