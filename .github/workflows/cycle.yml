name: Market Cycle Dashboard -> Telegram
on:
  workflow_dispatch:
  schedule:
    # Once daily only (2026-08-10 — reduced from 3x to cut Telegram noise).
    # Mid-session: 1:00 PM ET / 18:00 UTC. Kept at +12min offset from
    # intraday.yml's own 18:00 slot to avoid Twelve Data rate-limit
    # collisions — both workflows share TWELVEDATA_API_KEY.
    - cron: "12 18 * * 1-5"
jobs:
  cycle_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MPLBACKEND: Agg
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy matplotlib yfinance
      - name: Run cycle dashboard
        env:
          SYMBOLS: NVDA,AMAT,PLTR,TSLA,ZETA,BE,ANET,CRWD,ZS,DDOG,CDNS,AMZN,CEG,CRWV,NBIS,TSM,TER,ASML,MRVL,EQQQ,VUSA
          CAPITAL_PER_TICKER: "3000"
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.CYCLE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CYCLE_TELEGRAM_CHAT_ID }}
          TD_MIN_SECONDS_BETWEEN_CALLS: "11"
        run: |
          python cycle_bot.py
      - name: Commit cycle_data.json (web dashboard export, 2026-09-11)
        run: |
          if [ -f cycle_data.json ] && [ -n "$(git status --porcelain -- cycle_data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add cycle_data.json
            git commit -m "Update cycle_data.json [skip ci]"
            git push
          else
            echo "cycle_data.json unchanged or missing — nothing to commit."
          fi
