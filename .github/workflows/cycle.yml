name: Market Cycle Dashboard -> Telegram
on:
  workflow_dispatch:
  schedule:
    # Market open: 9:30 AM ET / 14:30 UTC
    - cron: "30 14 * * 1-5"
    # Mid-session: 1:00 PM ET / 18:00 UTC
    - cron: "0 18 * * 1-5"
    # Pre-close: 3:45 PM ET / 20:45 UTC
    - cron: "45 20 * * 1-5"
jobs:
  cycle_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MPLBACKEND: Agg
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy matplotlib yfinance
      - name: Run cycle dashboard
        env:
          SYMBOLS: TSLA,NVDA,PLTR,VUSA
          CAPITAL_PER_TICKER: "3000"
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.CYCLE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CYCLE_TELEGRAM_CHAT_ID }}
          TD_MIN_SECONDS_BETWEEN_CALLS: "11"
        run: |
          python cycle_bot.py
