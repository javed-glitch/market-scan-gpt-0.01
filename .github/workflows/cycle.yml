name: Market Cycle Dashboard -> Telegram

on:
  workflow_dispatch:
  schedule:
    # Mid-session: 1:00 PM ET = 18:00 UTC (Mon–Fri)
    - cron: "0 18 * * 1-5"
    # Pre-close: 3:45 PM ET = 20:45 UTC (Mon–Fri)
    - cron: "45 20 * * 1-5"

jobs:
  cycle_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy matplotlib

      # ✅ DEBUG STEP — DO NOT SKIP
      - name: Test Telegram delivery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CYCLE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CYCLE_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          print("Bot token present:", bool(token))
          print("Chat ID value:", chat_id)

          # Check bot identity
          me = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=30)
          print("getMe:", me.status_code, me.text)

          # Send test message
          r = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id": chat_id,
                  "text": "Cycle bot TEST message from GitHub Actions"
              },
              timeout=30
          )

          print("sendMessage status:", r.status_code)
          print("sendMessage response:", r.text)

          r.raise_for_status()
          PY

      - name: Run cycle dashboard
        env:
          SYMBOLS: TSLA,NVDA,PLTR
          CAPITAL_PER_TICKER: "3000"
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.CYCLE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CYCLE_TELEGRAM_CHAT_ID }}
          TD_MIN_SECONDS_BETWEEN_CALLS: "11"
        run: |
          python cycle_bot.py
